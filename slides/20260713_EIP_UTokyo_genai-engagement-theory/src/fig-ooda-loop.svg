<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 730 620" preserveAspectRatio="xMidYMid meet" font-family="'Helvetica Neue', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="ooda-arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#00736B"/>
    </marker>
  </defs>

  <!-- Center label -->
  <rect x="215" y="235" width="170" height="130" rx="6" ry="6" fill="#fff" stroke="#00736B" stroke-width="3"/>
  <text x="300" y="283" text-anchor="middle" font-size="28" font-weight="700" fill="#00736B">OODA</text>
  <text x="300" y="313" text-anchor="middle" font-size="20" fill="#333">Loop</text>
  <text x="300" y="345" text-anchor="middle" font-size="16" fill="#666">(主語：人間)</text>

  <!-- Four arcs -->
  <path d="M 380 130 A 240 240 0 0 1 470 220"
        fill="none" stroke="#00736B" stroke-width="4" marker-end="url(#ooda-arrow)"/>
  <path d="M 470 380 A 240 240 0 0 1 380 470"
        fill="none" stroke="#00736B" stroke-width="4" marker-end="url(#ooda-arrow)"/>
  <path d="M 220 470 A 240 240 0 0 1 130 380"
        fill="none" stroke="#00736B" stroke-width="4" stroke-dasharray="8,6" marker-end="url(#ooda-arrow)"/>
  <path d="M 130 220 A 240 240 0 0 1 220 130"
        fill="none" stroke="#00736B" stroke-width="4" marker-end="url(#ooda-arrow)"/>

  <!-- Nodes -->
  <!-- Observe (top) -->
  <circle cx="300" cy="80" r="60" fill="#E2F1EF" stroke="#00736B" stroke-width="3"/>
  <text x="300" y="73" text-anchor="middle" font-size="26" font-weight="700" fill="#00736B">Observe</text>
  <text x="300" y="103" text-anchor="middle" font-size="17" fill="#333">観る</text>
  <text x="230" y="45" text-anchor="end" font-size="18" font-weight="600" fill="#333">AIの出力を見る</text>
  <text x="230" y="68" text-anchor="end" font-size="15" fill="#666">（HITLで確認）</text>

  <!-- Orient (right) -->
  <circle cx="520" cy="300" r="60" fill="#E2F1EF" stroke="#00736B" stroke-width="3"/>
  <text x="520" y="293" text-anchor="middle" font-size="26" font-weight="700" fill="#00736B">Orient</text>
  <text x="520" y="323" text-anchor="middle" font-size="17" fill="#333">状況判断</text>
  <text x="560" y="400" text-anchor="middle" font-size="18" font-weight="600" fill="#333">自分の知識と照らす</text>

  <!-- Decide (bottom) -->
  <circle cx="300" cy="520" r="60" fill="#E2F1EF" stroke="#00736B" stroke-width="3"/>
  <text x="300" y="513" text-anchor="middle" font-size="26" font-weight="700" fill="#00736B">Decide</text>
  <text x="300" y="543" text-anchor="middle" font-size="17" fill="#333">意思決定</text>
  <text x="370" y="555" text-anchor="start" font-size="18" font-weight="600" fill="#333">採用 / 修正 / 棄却</text>
  <text x="370" y="578" text-anchor="start" font-size="15" fill="#666">（使うかどうか決める）</text>

  <!-- Act (left) -->
  <circle cx="80" cy="300" r="60" fill="#E2F1EF" stroke="#00736B" stroke-width="3"/>
  <text x="80" y="293" text-anchor="middle" font-size="26" font-weight="700" fill="#00736B">Act</text>
  <text x="80" y="323" text-anchor="middle" font-size="17" fill="#333">実行</text>
  <text x="40" y="400" text-anchor="middle" font-size="18" font-weight="600" fill="#333">再プロンプト／実装</text>

  <!-- Pause badge (directly above Orient) -->
  <g>
    <rect x="425" y="40" width="190" height="110" rx="8" ry="8"
          fill="#fff8e1" stroke="#e65100" stroke-width="2.5"/>
    <text x="520" y="76" text-anchor="middle" font-size="24" font-weight="700" fill="#e65100">Pause（確認）</text>
    <text x="520" y="106" text-anchor="middle" font-size="17" fill="#333">私はこの出力を</text>
    <text x="520" y="130" text-anchor="middle" font-size="17" fill="#333"><tspan font-weight="700">評価できる</tspan>か？</text>

    <!-- straight vertical line to Orient node -->
    <line x1="520" y1="150" x2="520" y2="240"
          stroke="#e65100" stroke-width="2.5"/>
  </g>
</svg>
